\r
## 任务信息\r
\r
- 项目路径：【当前文章项目绝对路径】\r
- 系列配置目录：【系列目录】/_meta/_config\r
- 输出文件：【项目路径】/06_成稿/标题.md\r
\r
## 必读\r
\r
1. 【项目路径】/06_成稿/终稿.md\r
2. 【项目路径】/00_立项.md\r
3. 【项目路径】/01_事实包.md（核对标题里的事实口径）\r
4. 【系列目录】/_meta/_config/系列基调与读者.md\r
5. 【系列目录】/_meta/_config/文风与格式.md\r
\r
## 生态检索（在本 agent 内部完成，不单独占一步）\r
\r
先检索同题内容的现有标题，看清楚这个题目下别人都怎么起标题，然后**避开**已经烂大街的句式。\r
\r
优先使用已启用的 MCP 工具；MCP 不可用再用 WebSearch/WebFetch。检索结果写进输出的「生态」一节，不另建文件。\r
\r
检索不到也没关系，写「未检索到同题内容」，继续出候选。\r
\r
