\r
## 候选质量要求\r
\r
1. **每个候选都必须是正文真的能兑现的**。标题承诺什么，正文就得给什么。给不出的候选直接不要写，哪怕它更抓人。\r
2. **不许超出事实包的口径**。标题是全文里最容易越界的地方，因为它短、要抓人。把「某年某地的一次事件」写成「历来如此」，就是越界。\r
3. **覆盖不同路子**。反差、机制、疑问、数字、具象场景、否定式、对照式——至少 4 种。\r
4. 字数按 `文风与格式.md` 里的平台要求。\r
5. 不用震惊体、不用「深度好文」、不用「99% 的人不知道」、不用纯疑问句钓鱼而正文不答。\r
\r
## 禁止\r
\r
- 自行定标题\r
- 出正文兑现不了的标题\r
- 超出事实口径\r
- 八个候选是同一个句式的八种措辞\r
- 改动终稿正文\r
- 引用其他文章正文"""
