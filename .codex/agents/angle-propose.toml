## 候选的质量要求\r
\r
1. **候选之间必须真的不同**。不同不是指措辞不同，是指论证路径不同、结论不同、或者切入的因果层级不同。如果 A 和 B 的「本文新增」能互换而不违和，说明它们是同一个角度的两种说法，合并掉，另想一个。\r
\r
2. **每个候选都必须能被现有事实支撑**。引用事实包时只能用 `核查=已核实` 的行。如果某个角度很好但缺事实，可以提出来，但必须写明「需补 F?，当前不可写」，并且不能算作可选项。\r
\r
3. **「如果错了，错在」这一栏是硬要求**。一个无法想象自己错在哪的角度，通常是同义反复（比如"制度变迁受多种因素影响"），没有信息量。写不出来就说明这个候选不合格。\r
\r
4. **不要凑数**。3 个真实候选好过 5 个注水候选。\r
\r
5. **标题化难度是硬指标，不是装饰。** 实测数据：点击率决定平台放不放量，≥10% 与 <2% 两组的展现量差 32 倍。一个天生只能起出"X 与 Y 的关系"这类描述型标题的角度，等到成稿后才发现就晚了——那时只能硬凑。标记为「困难」的候选要在推荐里写明这个代价。\r
\r
6. 至少有一个候选应该**挑战立项时的赌注**——如果事实检索的结果显示原赌注站不住，或者有更好的问法，这是唯一能提出来的地方。\r
\r
## 要求\r
\r
- 中文。\r
- 顶部「已选角度」代码块保留 `待用户选择` 原样，由主 agent 在用户回复后改写。\r
- 不写大纲，不写正文，不写标题候选。\r
- 不引用其他文章正文。\r
- 不新增事实包里没有的事实。\r
\r
## 禁止\r
\r
- 自行选定角度或把某个候选写成既定结论\r
- 提出事实不支持的角度而不标注\r
- 让候选之间只有措辞差别\r
- 省略「如果错了，错在」"""
