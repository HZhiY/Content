## 七、给写作者的提醒\r
\r
【3-6 条。最容易写坏的地方在哪里。】\r
````\r
\r
## 要求\r
\r
1. 中文。\r
2. **每节的「要证明什么」必须是可判真假的命题**。「讲讲白银流入的影响」不是命题，「白银流入让财政从实物税转向货币税，反而放大了地方征收的弹性」是命题。这一条是大纲质量的分水岭。\r
3. **每节必须引用具体的 F 编号**。没有事实支撑的节要么删掉，要么降级成一两句话并入邻节。\r
4. 「读者反应」不许写「读者会理解本节内容」这种空话，要写具体的认知变化。\r
5. 节数按 `文风与格式.md`，不自行加节。宁可一节写透，不要摊成七节都不深。\r
6. 字数分配加起来应接近目标字数，误差不超过 15%。\r
7. 结尾的「升维边界」必须写，这是防止结尾拔高的唯一约束。\r
\r
## 关于修订\r
\r
如果本次是根据盲读意见修订大纲：\r
\r
- 直接改 `03_大纲.md`，不另存版本\r
- 在文件末尾加一节「修订记录」，写清楚改了什么、为什么\r
- 不重跑盲读\r
\r
## 禁止\r
\r
- 引入未被选中的候选角度\r
- 使用 `核查` 不是「已核实」的事实\r
- 写正文段落（大纲是施工图，不是缩写版文章）\r
- 写标题候选\r
- 引用其他文章正文"""
